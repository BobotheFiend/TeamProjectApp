[project]
name = "team-task-board-mini-trello"
version = "1.0.0"
description = "Multi-organisation team task board: FastAPI + SQLModel backend, React frontend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.141.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.9",
    "pymysql>=1.2.0",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
